<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Axona Peer — Phase 2</title>
  <link rel="stylesheet" href="src/styles.css">
  <!-- v0.5.0 — importmap resolves `@axona/protocol/*` to the
       vendored slim subset under vendor/axona-protocol/.  Sync the
       vendored files from the canonical source at
       github.com/axona-net/axona-protocol by running
       `./scripts/sync-protocol.sh` from the repo root. -->
  <script type="importmap">
  {
    "imports": {
      "@axona/protocol": "./vendor/axona-protocol/src/index.js",
      "@axona/protocol/": "./vendor/axona-protocol/src/"
    }
  }
  </script>
</head>
<body>
  <main>
    <header>
      <h1>Axona Peer</h1>
      <p class="subtitle">Phase 2 · WebRTC mesh</p>
    </header>

    <section class="me">
      <div class="me-row">
        <span class="me-label">my id</span>
        <span id="my-id" class="me-value">—</span>
      </div>
      <div class="me-row">
        <span class="me-label">bridge</span>
        <span id="bridge-url" class="me-value mono"></span>
      </div>
      <div class="me-row">
        <span class="me-label">mesh peers (open / known)</span>
        <span id="mesh-count" class="me-value">0 of 0</span>
      </div>
      <div class="me-row">
        <span class="me-label">version</span>
        <span id="version" class="me-value mono">—</span>
      </div>
    </section>

    <section class="peers">
      <table class="peer-table">
        <thead>
          <tr>
            <th class="col-ind"></th>
            <th class="col-peer">peer</th>
            <th class="col-rtt">RTT</th>
            <th class="col-traf">pongs</th>
            <th class="col-up">up</th>
          </tr>
        </thead>
        <tbody id="peer-table-body">
          <!-- rows are rendered by client.js -->
        </tbody>
      </table>
    </section>

    <section class="log">
      <div class="log-header">
        <h2>Event log</h2>
        <button id="log-clear" class="log-clear" type="button">clear</button>
      </div>
      <ul id="log-list" class="log-list"></ul>
    </section>

    <footer>
      <p>
        Override the bridge URL with <code>?bridge=ws://&hellip;</code> in the query string.
        Source: <a href="https://github.com/axona-net/axona-peer">axona-net/axona-peer</a>.
      </p>
    </footer>
  </main>

  <!-- Floating QR launcher: small thumbnail in the top-right corner.
       Tap to open the overlay with a large scannable version. -->
  <button id="qr-launcher" class="qr-launcher" type="button"
          aria-label="Show join QR code" aria-haspopup="dialog"></button>

  <!-- Modal overlay with the large QR.  Hidden by default; shown when
       the launcher is clicked.  Click anywhere (backdrop, card, or the
       × button) to dismiss. -->
  <div id="qr-overlay" class="qr-overlay" role="dialog"
       aria-modal="true" aria-label="Join this mesh" hidden>
    <div class="qr-overlay-card">
      <button id="qr-overlay-close" class="qr-overlay-close" type="button"
              aria-label="Close">&times;</button>
      <div id="qr-overlay-image" class="qr-overlay-image"></div>
      <code id="qr-overlay-url" class="qr-overlay-url"></code>
    </div>
  </div>

  <script type="module" src="src/client.js"></script>
</body>
</html>
